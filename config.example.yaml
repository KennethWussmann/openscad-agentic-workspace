# Workspace settings. `pnpm scad doctor` copies this file to config.yaml (gitignored) on first run.
# Every project can override any of these keys in workspace/<project>/config.yaml.
# Objects are merged key by key, lists and plain values replace the inherited value.
#
# Project-only keys, valid in workspace/<project>/config.yaml but not in this file:
#   name, description   shown in the viewer and in `pnpm scad list`
#   parts               the entry files and part selectors that are rendered (see the scad-craft skill)
#   sets                named parameter sets: recurring variants of the same model, e.g.
#     sets:
#       screw-tray:
#         label: Screw tray                   # optional, shown in the viewer's set dropdown
#         values: { width: 160, depth: 80 }   # customizer values, checked against the parameters
#         export: true                        # optional, `pnpm scad release` checks and exports it too
#         parts: [main]                       # optional, apply the set to these parts only
#     Later wins: render.defines, then set values, then parts[].defines.
#     Edit them with `pnpm scad set save|rm|unset|rename-param`, list them with `pnpm scad sets <project>`.

# Third-party OpenSCAD libraries, cloned into workspace/_vendor/<name>@<ref>/<name> and put on OPENSCADPATH.
# The key is the folder name used in include/use, e.g. include <BOSL2/std.scad>.
# Pin ref to a tag or commit; `pnpm scad lib add` pins to the current commit when no ref is given.
# Projects inherit these and can add their own or re-pin a ref in their config.yaml.
libraries: {}
#  BOSL2:
#    git: https://github.com/BelfrySCAD/BOSL2.git
#    ref: <tag or commit>

openscad:
  # Path to the OpenSCAD executable, or a command as a list (e.g. [flatpak, run, org.openscad.OpenSCAD]).
  # Leave null to auto-discover; the first successful discovery is written back here.
  path: null
  # Geometry backend: manifold (fast, default) or cgal.
  backend: manifold
  # Kill a single OpenSCAD run after this many seconds.
  timeoutSeconds: 600
  # Experimental features passed as --enable, e.g. [lazy-union, roof].
  enable: []

render:
  # Values passed as -D to every part, e.g. { $fs: 0.4, $fa: 2 }.
  defines: {}
  # Render preview/sheet.png (iso, front, right, top) after every CLI render.
  sheet: true
  # Edge length of the square contact sheet in pixels.
  sheetSize: 1200
  # OpenSCAD colorscheme used for sheet and snapshot images.
  colorscheme: Tomorrow Night

export:
  # Formats written by `pnpm scad export`: 3mf, stl, asciistl, obj, off, wrl, png, svg, dxf, pdf, csg.
  formats: [3mf, stl]
  # File name template without extension. Placeholders: {project}, {part}, {version}, {set}.
  # {set} is the parameter set name, or "default" for the model without a set. Without {set} in the
  # template, files of a set get a -<set> suffix and the default model keeps the plain name.
  filename: "{project}-{part}"

server:
  # Preferred dev server port; the next free port is used if it is taken.
  port: 5180
  # Open the default browser when the agent shows a model and no viewer tab is connected.
  open: true

# What you design for: the printer, nozzle and layer height. Used by `pnpm scad check`, the viewer
# (build plate, overlays) and the agent (tolerances and clearances, `pnpm scad printer`).
# Projects switch any of these in their config.yaml, e.g. `print: { nozzle: 0.6 }` or `print: { printer: mars }`.
print:
  # Active printer, a key of `printers`.
  printer: default
  # Nozzle to design for (fdm only), one of the printer's `nozzles`. null = the first one in the list.
  nozzle: null
  # Layer height in mm. null = the printer's `layerHeight`.
  layerHeight: null

# The printers you own, by name. `process` decides which keys apply:
#   fdm:   bed, nozzles, layerHeight, overhangAngle, minWall, tolerances
#   resin: bed, pixel, layerHeight, minWall, minFeature, drainHole, tolerances (SLA, MSLA, DLP)
# Tolerances are per side for mating parts; `hole` is added to the diameter of holes for pins and screws.
printers:
  default:
    process: fdm
    # Build volume [x, y, z] in mm. Parts larger than this fail the bed check.
    bed: [256, 256, 256]
    # Nozzle diameters this printer can use, the first is the default. Walls thinner than the nozzle fail.
    nozzles: [0.4]
    layerHeight: 0.2
    # Faces tilted further than this many degrees from vertical count as overhangs. Faces on the bed are ignored.
    overhangAngle: 45
    # Walls thinner than this (mm) are reported. null means 2 x nozzle.
    minWall: null
    tolerances: { press: 0.2, sliding: 0.3, loose: 0.45, hole: 0.2 }
#  mars:
#    process: resin
#    bed: [143, 89, 175]
#    # XY pixel size of the screen or projector in mm.
#    pixel: 0.035
#    layerHeight: 0.05
#    # Walls thinner than this warn, details thinner than minFeature fail.
#    minWall: 0.8
#    minFeature: 0.3
#    # Smallest drain/vent hole diameter for hollow parts, in mm.
#    drainHole: 2.5
#    tolerances: { press: 0.05, sliding: 0.1, loose: 0.2, hole: 0.1 }

# Analysis settings for `pnpm scad check` and the viewer overlays.
check:
  # Overhang and thin-wall regions smaller than this (mm2) are not reported.
  minRegionArea: 1
